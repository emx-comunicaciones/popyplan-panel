name: CI

on:
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # El job de e2e (Playwright + backend Django en servicio, migraciones y
  # seed_panel_demo) llega en la tarea W6, cuando exista esa cuenta demo.
